name: Publish verified portable release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows portable build run ID
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate successful build and resolve its commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          metadata=$(gh run view "$BUILD_RUN_ID" --json headSha,conclusion,workflowName)
          test "$(jq -r .conclusion <<< "$metadata")" = success
          test "$(jq -r .workflowName <<< "$metadata")" = "Windows portable build"
          echo "sha=$(jq -r .headSha <<< "$metadata")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-portable
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version, commit, notes, and checksums
        id: release
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: python scripts/release_artifacts.py release-assets --expected-commit "$BUILD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Publish the verified version
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--latest)
          if [[ "$IS_PRERELEASE" = true ]]; then flags=(--prerelease); fi
          gh release create "$RELEASE_VERSION" "release-assets/$RELEASE_ARCHIVE" "release-assets/$RELEASE_NOTES" release-assets/SHA256SUMS.txt release-assets/release.json \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" \
            --title "$RELEASE_VERSION - Windows portable release" \
            --notes-file "release-assets/$RELEASE_NOTES" "${flags[@]}"
