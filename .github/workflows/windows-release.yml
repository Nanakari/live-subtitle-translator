name: Windows portable build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check dependencies and run tests
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke test portable executable
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/build_windows.py --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: dist/*
          if-no-files-found: error
          retention-days: 14
