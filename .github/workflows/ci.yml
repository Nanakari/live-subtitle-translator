name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q app.py chrome_server.py scripts src
      - name: Validate extension manifest
        run: python -m json.tool chrome-extension/manifest.json > /dev/null
      - name: Check extension JavaScript
        run: |
          node --check chrome-extension/content.js
          node --check chrome-extension/offscreen.js
          node --check chrome-extension/service-worker.js
